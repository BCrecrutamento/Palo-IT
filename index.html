<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruna Coelho · Candidatos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f4fa;--sf:#fff;--tx:#221028;--mu:#6e6479;--bd:#e3dbea;--ac:#5a2a85;--acx:#fff;--ch:#efe7f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151218;--sf:#201b26;--tx:#efeaf4;--mu:#a79db3;--bd:#372f40;--ac:#c4a3ec;--acx:#1c1128;--ch:#2a2233}}
:root[data-theme="dark"]{--bg:#151218;--sf:#201b26;--tx:#efeaf4;--mu:#a79db3;--bd:#372f40;--ac:#c4a3ec;--acx:#1c1128;--ch:#2a2233}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.5 Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:linear-gradient(90deg,#4b115f,#330843);color:#fff}
header img{height:54px;max-width:100%;display:block}header .sp{flex:1}
header .btn{background:transparent;color:#fff;border-color:#ffffff55}header .btn.on,header .btn.p{background:#fff;color:#4a1a68;border-color:#fff}#st{color:#e5d8f3!important}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:6px}
.ban{padding:14px 20px 0;font-weight:600;font-size:17px;letter-spacing:.02em}.ban small{display:block;font-weight:400;font-size:12px;color:var(--mu);margin-top:2px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--sf);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.board{display:flex;gap:12px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 270px;background:var(--ch);border-radius:12px;padding:10px;min-height:200px}
.col h2{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.card:hover{border-color:var(--ac)}
.av{width:40px;height:40px;border-radius:50%;background:var(--bd);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:600;color:var(--mu);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.card small{color:var(--mu);display:block}
.tag{display:inline-block;font-size:11px;background:var(--ch);padding:1px 7px;border-radius:99px;margin-top:2px}
.over{outline:2px dashed var(--ac)}
#cal{padding:16px 20px;display:none}
.cn{display:flex;align-items:center;gap:10px;margin-bottom:10px}.cn b{flex:1;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dh{font-size:11px;color:var(--mu);text-align:center}
.day{background:var(--sf);border:1px solid var(--bd);border-radius:8px;min-height:92px;padding:4px;overflow:hidden}
.day.o{opacity:.45}.day.t{border-color:var(--ac)}.day i{font-style:normal;font-size:11px;color:var(--mu)}
.ev{display:block;width:100%;text-align:left;font-size:11px;background:var(--ch);border:0;border-left:3px solid var(--ac);border-radius:4px;padding:2px 4px;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw{overflow-x:auto}.cw .grid{min-width:700px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);width:min(720px,94vw);max-height:92vh;padding:0}
dialog::backdrop{background:#0008}
.dh2{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--bd);align-items:center}
.dh2 .av{width:64px;height:64px;font-size:22px}
.bd{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bd .f{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 9px}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{padding:5px 10px}
.lk a{color:var(--ac);margin-right:14px;text-decoration:none;display:inline-flex;align-items:center}
.mr{display:grid;grid-template-columns:120px 150px 110px;gap:8px;align-items:center;margin-bottom:8px}.mr label.ck{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:13px;font-weight:500}.mr input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);padding:0}.chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.chip{font-size:10.5px;border:1px solid var(--bd);border-radius:99px;padding:0 7px;color:var(--mu)}.chip.ok{background:var(--ac);border-color:var(--ac);color:var(--acx)}.cvr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cvr a{color:var(--ac)}
.ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);justify-content:space-between}
#st{font-size:12px;color:var(--mu)}
@media(max-width:600px){.bd{grid-template-columns:1fr}.mr{grid-template-columns:1fr 1fr}}
</style></head><body>

n.com/in/carlos-alexandre-das-dores/", "nome": "Carlos Alexandre das Dores", "outroIdioma": "", "parecerBruna": "Aderência ao perfil: Candidato prioritário\n\nCarlos demonstrou sólida experiência com PHP, linguagem com a qual trabalha desde a versão 4.3, passando pelo desenvolvimento procedural, orientação a objetos e versões mais recentes, até o PHP 8.3. Possui vivência tanto com PHP puro quanto com frameworks, incluindo a experiência de ter desenvolvido seu próprio framework para atender às necessidades de uma plataforma de e-commerce.\nDurante a entrevista, apresentou exemplos consistentes de atuação em sistemas legados e processos de migração de versões do PHP em ambientes de produção. Demonstrou conhecimento dos riscos envolvidos, especialmente em relação a funções descontinuadas, incompatibilidades e necessidade de reescrita de código. Ressaltou a importância de realizar atualizações controladas, evitando saltos de versões sem planejamento e validação adequados.\nTrouxe um exemplo relevante de sua atuação em uma plataforma de e-commerce, na qual utilizava um ambiente de homologação espelhado em produção, com atualização diária dos dados e funcionalidades. Explicou que realizava testes de estresse, simulando acessos simultâneos para validar a capacidade e estabilidade da aplicação antes das implantações. Demonstrou preocupação com a continuidade operacional, monitoramento e prevenção de falhas.\nEm relação à autonomia técnica, relatou que sempre manteve atuação hands-on, inclusive durante os períodos em que exerceu funções de Tech Lead. Demonstrou maturidade ao afirmar que não possui dificuldades em atuar sob liderança e que seu principal foco está na qualidade das entregas e no atendimento às necessidades do cliente.\nTambém apresentou uma abordagem estruturada para assumir sistemas legados desconhecidos, iniciando pela análise do código, revisão da documentação, testes locais e alinhamento com stakeholders para compreender os processos de negócio. Destacou sua preocupação em antecipar possíveis falhas, considerando diferentes jornadas e comportamentos dos usuários durante os testes.\n\nMinha avaliação:\nCarlos demonstrou boa desenvoltura, segurança ao falar sobre sua trajetória e conhecimento consistente de PHP e sistemas legados. Diferentemente de perfis cuja experiência está concentrada exclusivamente em frameworks, apresentou histórico relevante com PHP puro, evolução da linguagem e modernização de aplicações em produção. Seus relatos indicam maturidade técnica, autonomia e preocupação com estabilidade operacional.\nEncaminharei ao cliente.", "parecerTecnico": "Análise atualizada após a entrevista:\nCarlos trabalha com PHP desde a versão 4.3, passando pelo desenvolvimento procedural, orientação a objetos e versões mais recentes, até o PHP 8.3. Tem vivência com PHP puro e com frameworks, incluindo um framework próprio desenvolvido para uma plataforma de e-commerce.\nNa entrevista, apresentou exemplos de atuação em sistemas legados e em migração de versões do PHP em produção, com conhecimento dos riscos (funções descontinuadas, incompatibilidades e reescrita de código) e preferência por atualizações controladas, sem saltos de versão. Atuou como Tech Lead mantendo postura hands-on.\nA triagem inicial pelo LinkedIn, que não permitia comprovar a senioridade, foi superada pelas evidências apresentadas na entrevista.", "pretensao": "R$ 8.500", "reunioes": [{"com": "Bruna", "data": "2026-11-03", "hora": "14:00", "tipo": "Entrevista Bruna"}, {"com": "Marcos", "data": "2026-11-04", "hora": "17:15", "tipo": "Entrevista Marcos"}], "stage": "Entrevista CTO", "telefone": ""}, "eduardo-augusto": {"cidade": "Recife - PE", "cv": "", "email": "duuh-l@hotmail.com", "foto": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCABwAHADASIAAhEBAxEB/8QAHwA eensão dos desafios envolvidos na modernização de sistemas críticos em produção, trazendo exemplos concretos de sua atuação.\nAlém da experiência técnica, destaco sua boa desenvoltura, comunicação articulada e maturidade profissional. Demonstrou habilidades comportamentais bem desenvolvidas, especialmente ao relatar sua experiência em liderança, período em que buscou aprimorar conscientemente sua comunicação e gestão de pessoas. Reconheceu a importância de adaptar sua abordagem, manter a equipe motivada, administrar expectativas e conduzir as pessoas de forma colaborativa, sem perder o foco nas entregas.", "parecerTecnico": "Eduardo demonstrou boa aderência à oportunidade da PALO IT, apresentando aproximadamente 9 anos de experiência com PHP, incluindo atuação em sistemas legados, PHP puro e versões desde a 5.5 até a 8.1. Durante a entrevista, trouxe dois projetos relevantes: um sistema de consórcios de concessionárias Toyota e uma plataforma de uma Câmara de Vereadores, ambos envolvendo modernização de aplicações antigas. Destacou sua participação na migração gradual do PHP 5.5 para o 7.1, com refatoração de código, adequação de dependências e tratamento de incompatibilidades, especialmente em bibliotecas de assinaturas eletrônicas. Demonstrou conhecimento sobre os riscos envolvidos nesse tipo de projeto, explicando a utilização de feature flags, liberações graduais por módulo, monitoramento e validação das funcionalidades antes da desativação do código anterior. Também relatou experiência com Docker e ferramentas de qualidade e testes, embora seja importante aprofundar a utilização prática de Rector, PHPUnit e análise estática na etapa técnica.\nEm relação à senioridade, apresentou experiência consistente em liderança técnica na Watch Brasil, onde participou ativamente das decisões de arquitetura, modernização de aplicações Laravel, escalabilidade e performance, além da gestão e desenvolvimento da equipe. Durante a conversa, mostrou-se comunicativo, articulado e s a migração de PHP 7.2 para PHP 8, concluindo a atualização da linguagem. Também participou da atualização do Laravel, que não foi finalizada devido ao encerramento das atividades da empresa. Relatou ainda projetos freelancers de atualização de Laravel e PHP, incluindo adequações à versão 8.2 por requisitos da infraestrutura AWS.\n\nAtuação técnica: Demonstrou familiaridade com os desafios de migração de sistemas legados, destacando incompatibilidades entre versões, atualização de bibliotecas, segurança, integrações e preservação das regras de negócio. Explicou a importância de realizar atualizações gradualmente, utilizando rotas e endpoints paralelos para validar funcionalidades e reduzir impactos na operação.\n\nLiderança e autonomia: Na Alexandria, atuou como desenvolvedor sênior, respondendo a um líder técnico, mas assumindo a condução de um squad. Participou da arquitetura de um sistema de cobranças, direcionamento de desenvolvedores, code reviews, reuniões com gestores e desenvolvimento de integrações críticas com gateways de pagamento e API da Meta. Também participou da migração de uma aplicação legada em Node-RED para NestJS.\n\nGestão de incidentes: Compartilhou uma situação crítica em produção envolvendo falhas na recorrência de pagamentos após uma entrega realizada sob prazo corrido. Participou diretamente da investigação e correção do problema, em conjunto com outros 2 desenvolvedores, durante aproximadamente 24 horas.\n\nDisponibilidade: Informou disponibilidade imediata para novos projetos e reforçou seu interesse em continuar atuando com PHP, linguagem com a qual trabalha desde 2020 e possui afinidade profissional.\n\nMinha avaliação:\nGustavo apresentou uma entrevista bastante positiva, demonstrando segurança ao relatar suas experiências e conhecimento consistente em PHP e modernização de sistemas legados. Trouxe exemplos concretos de projetos de migração de versões, detalhando sua participação, os desafios enfrentados e os cuidados necessários para garantir a estabilidade das aplicações. Demonstrou compreender a complexidade desse tipo de projeto, especialmente em relação aos riscos técnicos e à continuidade da operação.\nNo aspecto comportamental, mostrou-se comunicativo, desenvolto, pontual e com boa capacidade de articulação. Destacou-se também pelo interesse genuíno em trabalhar com PHP, mencionando que está buscando oportunidades especificamente para retomar uma atuação mais concentrada na linguagem, inclusive com PHP puro.\nEmbora tenha aproximadamente 5 anos de experiência efetiva com PHP, abaixo do tempo solicitado na descrição da vaga, apresentou vivências práticas relevantes e boa maturidade profissional.\nMeu parecer é favorável ao avanço no processo seletivo, apresentarei esse candidato à Palo IT para aprofundamento técnico e validação da aderência ao desafio do projeto.", "parecerTecnico": "Análise inicial do perfil:\nProfissional com mais de 6 anos de experiência declarada em desenvolvimento, com atuação em PHP, Laravel, APIs REST e modernização de sistemas legados. Relata participação em 3 projetos de migração, sendo 2 envolvendo PHP e 1 JavaScript/TypeScript. Destaca migrações de PHP 7 para 8, adequações de componentes legados do PHP 5 e atualização do Laravel 9 para 12. Apresenta conhecimentos em Composer, atualização de dependências, refatoração, testes e correção de regressões. Possui experiência complementar em arquitetura backend, bancos de dados, Docker e CI/CD. Aderência técnica relevante, porém ainda sem comprovação de liderança nas migrações exigidos pela vaga.", "pretensao": "10 a 12 k", "reunioes": [{"com": "Bruna", "data": "2026-11-03", "hora": "09:00", "tipo": "Entrevista Bruna"}, {"com": "Marcos", "data": "2026-11-03", "hora": "16:15", "tipo": "Entrevista Marcos"}, {"com": "CTO", "data": "2026-11-05", "hora": "17:00", "tipo": "Entrevista CTO"}], "stage": "Entrevista CTO", "telefone": ""}, "ricardo-carvalho": {"cidade": "Brasília - DF", "cv": "", "email": "rickmanu@gmail.com", "foto os, PHP puro e modernização de aplicações críticas em produção. Possui histórico relevante em projetos governamentais de grande porte, com passagens pela Funasa, Ministério da Defesa e Ministério da Cultura. Destaco sua experiência na Hepta, onde liderou a migração e consolidação de 26 aplicações desenvolvidas em diferentes tecnologias, incluindo PHP puro, Laravel, Joomla, Drupal e WordPress, envolvendo atualização para PHP 8, migração de bancos de dados e modernização de infraestrutura com Docker e Kubernetes. Demonstrou conhecimento sobre os cuidados necessários para garantir a continuidade operacional, incluindo planejamento de migrações, execução em janelas controladas e preservação da estabilidade dos sistemas. Também possui experiência como Tech Lead, gestão de equipes e atuação internacional em Portugal. Apresenta inglês fluente, utilizado profissionalmente em sua última experiência com uma empresa americana e equipes europeias.", "pretensao": "R$ 16.000", "reunioes": [{"com": "Bruna", "data": "2026-11-05", "hora": "08:00", "tipo": "Entrevista"}, {"data": "2026-05-11", "hora": "", "tipo": "Entrevista", "com": "Marcos"}], "stage": "Entrevista Marcos", "telefone": ""}, "roni-clei": {"cidade": "Palhoça - SC", "cv": "", "email": "", "foto": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCABwAHADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3 l. Não ficou apenas em respostas genéricas, conseguindo contextualizar sua participação e os desafios enfrentados em experiências anteriores.", "parecerTecnico": "apresentou boa aderência técnica à oportunidade, demonstrando experiência prática com PHP puro, sustentação de sistemas legados e migração de versões em ambientes de produção. Durante a conversa, trouxe exemplos concretos de sua atuação, destacando a migração de um sistema jurídico próprio de PHP 5.6 para 8.4, além de experiências com sistemas legados no Divino Fogão e na Panasonic. Demonstrou conhecimento sobre a complexidade dessas atualizações, abordando cuidados com mapeamento de regras de negócio, documentação, homologação, migração gradual e estratégias de rollback para preservar a continuidade operacional.\nConsidero positivo o fato de ter trabalhado diretamente com PHP procedural e sistemas pouco documentados, características importantes para o projeto da Palo IT. Seus relatos indicam familiaridade com ambientes críticos e preocupação com a estabilidade das aplicações. Como ponto de atenção, possui inglês básico, aspecto que deverá ser avaliado conforme a necessidade do projeto.", "pretensao": "R$ 8.000", "reunioes": [{"com": "Bruna", "data": "2026-11-04", "hora": "10:00", "tipo": "Entrevista"}, {"com": "Marcos", "data": "2026-11-05", "hora": "15:30", "tipo": "Entrevista "}], "stage": "Entrevista Marcos", "telefone": ""}, "cmw3vfie4": {"nome": "Tiago Perrelli", "stage": "Entrevista Marcos", "reunioes": [{"data": "2026-11-05", "hora": "", "tipo": "Entrevista", "com": "Bruna"}], "linkedin": "https://www.linkedin.com/in/tperrelli/", "cv": "", "github": "", "telefone": "(81)99738-0232", "email": "tiago.perrelli@gmail.com", "pretensao": "R$ 20.000", "cidade": "Recife PE", "foto": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
