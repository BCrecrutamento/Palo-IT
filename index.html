<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruna Coelho · Candidatos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f4fa;--sf:#fff;--tx:#221028;--mu:#6e6479;--bd:#e3dbea;--ac:#5a2a85;--acx:#fff;--ch:#efe7f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151218;--sf:#201b26;--tx:#efeaf4;--mu:#a79db3;--bd:#372f40;--ac:#c4a3ec;--acx:#1c1128;--ch:#2a2233}}
:root[data-theme="dark"]{--bg:#151218;--sf:#201b26;--tx:#efeaf4;--mu:#a79db3;--bd:#372f40;--ac:#c4a3ec;--acx:#1c1128;--ch:#2a2233}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.5 Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:linear-gradient(90deg,#4b115f,#330843);color:#fff}
header img{height:54px;max-width:100%;display:block}header .sp{flex:1}
header .btn{background:transparent;color:#fff;border-color:#ffffff55}header .btn.on,header .btn.p{background:#fff;color:#4a1a68;border-color:#fff}#st{color:#e5d8f3!important}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:6px}
.ban{padding:14px 20px 0;font-weight:600;font-size:17px;letter-spacing:.02em}.ban small{display:block;font-weight:400;font-size:12px;color:var(--mu);margin-top:2px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--sf);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.board{display:flex;gap:12px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 270px;background:var(--ch);border-radius:12px;padding:10px;min-height:200px}
.col h2{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.card:hover{border-color:var(--ac)}
.av{width:40px;height:40px;border-radius:50%;background:var(--bd);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:600;color:var(--mu);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.card small{color:var(--mu);display:block}
.tag{display:inline-block;font-size:11px;background:var(--ch);padding:1px 7px;border-radius:99px;margin-top:2px}
.over{outline:2px dashed var(--ac)}
#cal{padding:16px 20px;display:none}
.cn{display:flex;align-items:center;gap:10px;margin-bottom:10px}.cn b{flex:1;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dh{font-size:11px;color:var(--mu);text-align:center}
.day{background:var(--sf);border:1px solid var(--bd);border-radius:8px;min-height:92px;padding:4px;overflow:hidden}
.day.o{opacity:.45}.day.t{border-color:var(--ac)}.day i{font-style:normal;font-size:11px;color:var(--mu)}
.ev{display:block;width:100%;text-align:left;font-size:11px;background:var(--ch);border:0;border-left:3px solid var(--ac);border-radius:4px;padding:2px 4px;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw{overflow-x:auto}.cw .grid{min-width:700px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);width:min(720px,94vw);max-height:92vh;padding:0}
dialog::backdrop{background:#0008}
.dh2{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--bd);align-items:center}
.dh2 .av{width:64px;height:64px;font-size:22px}
.bd{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bd .f{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 9px}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{padding:5px 10px}
.lk a{color:var(--ac);margin-right:14px;text-decoration:none;display:inline-flex;align-items:center}
.mr{display:grid;grid-template-columns:120px 150px 110px;gap:8px;align-items:center;margin-bottom:8px}.mr label.ck{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:13px;font-weight:500}.mr input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);padding:0}.chips{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.chip{font-size:10.5px;border:1px solid var(--bd);border-radius:99px;padding:0 7px;color:var(--mu)}.chip.ok{background:var(--ac);border-color:var(--ac);color:var(--acx)}.cvr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cvr a{color:var(--ac)}
.ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);justify-content:space-between}
#st{font-size:12px;color:var(--mu)}
@media(max-width:600px){.bd{grid-template-columns:1fr}.mr{grid-template-columns:1fr 1fr}}
</style></head><body>

tps://www.linkedin.com/in/carlos-alexandre-das-dores/","nome":"Carlos Alexandre das Dores","outroIdioma":"","parecerBruna":"Carlos demonstrou boa desenvoltura, segurança ao falar sobre sua trajetória e conhecimento consistente de PHP e sistemas legados. Diferentemente de perfis cuja experiência está concentrada exclusivamente em frameworks, apresentou histórico relevante com PHP puro, evolução da linguagem e modernização de aplicações em produção. Seus relatos indicam maturidade técnica, autonomia e preocupação com estabilidade operacional.","parecerTecnico":"Carlos demonstrou sólida experiência com PHP, linguagem com a qual trabalha desde a versão 4.3, passando pelo desenvolvimento procedural, orientação a objetos e versões mais recentes, até o PHP 8.3. Possui vivência tanto com PHP puro quanto com frameworks, incluindo a experiência de ter desenvolvido seu próprio framework para atender às necessidades de uma plataforma de e-commerce.\nDurante a entrevista, apresentou exemplos consistentes de atuação em sistemas legados e processos de migração de versões do PHP em ambientes de produção. Demonstrou conhecimento dos riscos envolvidos, especialmente em relação a funções descontinuadas, incompatibilidades e necessidade de reescrita de código. Ressaltou a importância de realizar atualizações controladas, evitando saltos de versões sem planejamento e validação adequados.\nTrouxe um exemplo relevante de sua atuação em uma plataforma de e-commerce, na qual utilizava um ambiente de homologação espelhado em produção, com atualização diária dos dados e funcionalidades. Explicou que realizava testes de estresse, simulando acessos simultâneos para validar a capacidade e estabilidade da aplicação antes das implantações. Demonstrou preocupação com a continuidade operacional, monitoramento e prevenção de falhas.\nEm relação à autonomia técnica, relatou que sempre manteve atuação hands-on, inclusive durante os períodos em que exerceu funções de Tech Lead. Demonstrou maturidade ao afirmar que não possui dificuldades em atuar sob liderança e que seu principal foco está na qualidade das entregas e no atendimento às necessidades do cliente.\nTambém apresentou uma abordagem estruturada para assumir sistemas legados desconhecidos, iniciando pela análise do código, revisão da documentação, testes locais e alinhamento com stakeholders para compreender os processos de negócio. Destacou sua preocupação em antecipar possíveis falhas, considerando diferentes jornadas e comportamentos dos usuários durante os testes.","pretensao":"R$ 8.500","reunioes":[{"com":"Bruna","tipo":"Entrevista Bruna","data":"2026-11-03","hora":"14:00","feito":true},{"com":"Marcos","tipo":"Entrevista Marcos","data":"2026-11-04","hora":"17:15","feito":true}],"stage":"Entrevista CTO","telefone":""},"eduardo-augusto":{"cidade":"Recife - PE","cv":null,"email":"duuh-l@hotmail.com","foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCABwAHADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6pooooAKKZLMkK7nP0HrWdNdyTHGdq+gpOVhpXL0l3FHxu3H0FRNfMT8qAfWqK1V1jXdM8PWEt/qt7BZ20SlmklcKPw9T7Co5mx2NU3Up7j8BThcyDuPyrxe5/aq+Hls0kcb6rcspwpitflb3yWHFGk/tU+AdQdUu/wC0rBmIGZLfcg+pB4/KhNhoe1rdn+JR+FTJOj9Dg+hrE0nWtO12zjvdLvbe9tpBlZIXDA/l0q7RzNBY0aKpxTsnB5FW1cOMg8VadxW s projetos relevantes: um sistema de consórcios de concessionárias Toyota e uma plataforma de uma Câmara de Vereadores, ambos envolvendo modernização de aplicações antigas. Destacou sua participação na migração gradual do PHP 5.5 para o 7.1, com refatoração de código, adequação de dependências e tratamento de incompatibilidades, especialmente em bibliotecas de assinaturas eletrônicas. Demonstrou conhecimento sobre os riscos envolvidos nesse tipo de projeto, explicando a utilização de feature flags, liberações graduais por módulo, monitoramento e validação das funcionalidades antes da desativação do código anterior. Também relatou experiência com Docker e ferramentas de qualidade e testes, embora seja importante aprofundar a utilização prática de Rector, PHPUnit e análise estática na etapa técnica.\nEm relação à senioridade, apresentou experiência consistente em liderança técnica na Watch Brasil, onde participou ativamente das decisões de arquitetura, modernização de aplicações Laravel, escalabilidade e performance, além da gestão e desenvolvimento da equipe. Durante a conversa, mostrou-se comunicativo, articulado e seguro ao explicar suas experiências, trazendo exemplos concretos e demonstrando maturidade na condução de projetos e no relacionamento com equipes. Destaco sua capacidade de compreender a complexidade de sistemas legados e a importância de preservar a estabilidade operacional durante uma migração.","pretensao":"R$ 15.000","reunioes":[{"com":"Bruna","tipo":"Entrevista Bruna","data":"2026-11-03","hora":"15:00","feito":true},{"com":"Marcos","tipo":"Entrevista Marcos","data":"2026-11-09","hora":"14:30","feito":false}],"stage":"Entrevista Marcos","telefone":""},"gustavo-vinicius":{"cidade":"Curitiba - PR","cv":{"nome":"Curriculo_GustavoVinicius.pdf","dados":"data:application/pdf;base64,JVBERi0xLjQKJdPr6eEKMSAwIG9iago8PC9UaXRsZSAoQ3VycmljdWxvX0d1c3Rhdm9WaW5pY2l1cy5kb2N4KQovUHJvZHVjZXIgKFNraWEvUERGIG0xNTggR29vZ2xlIERvY3MgUmVuZGVyZXIpPj4KZW5kb2JqCjMgMCBvYmoKPDwv  de versões. Demonstrou compreender a complexidade do projeto da Palo IT, principalmente os desafios relacionados à modernização de um sistema antigo, pouco documentado e que precisa permanecer em produção durante a migração.\nPercebi maturidade na forma como abordou os cuidados necessários para esse tipo de projeto, demonstrando preocupação com planejamento, riscos e continuidade operacional. Não ficou apenas em respostas genéricas, conseguindo contextualizar sua participação e os desafios enfrentados em experiências anteriores.","parecerTecnico":"Apresentou boa aderência técnica à oportunidade, demonstrando experiência prática com PHP puro, sustentação de sistemas legados e migração de versões em ambientes de produção. Durante a conversa, trouxe exemplos concretos de sua atuação, destacando a migração de um sistema jurídico próprio de PHP 5.6 para 8.4, além de experiências com sistemas legados no Divino Fogão e na Panasonic. Demonstrou conhecimento sobre a complexidade dessas atualizações, abordando cuidados com mapeamento de regras de negócio, documentação, homologação, migração gradual e estratégias de rollback para preservar a continuidade operacional.\nConsidero positivo o fato de ter trabalhado diretamente com PHP procedural e sistemas pouco documentados, características importantes para o projeto da Palo IT. Seus relatos indicam familiaridade com ambientes críticos e preocupação com a estabilidade das aplicações. Como ponto de atenção, possui inglês básico, aspecto que deverá ser avaliado conforme a necessidade do projeto.","pretensao":"R$ 8.000","reunioes":[{"com":"Bruna","tipo":"Entrevista Bruna","data":"2026-11-04","hora":"10:00","feito":true},{"com":"Marcos","tipo":"Entrevista Marcos","data":"2026-11-05","hora":"17:30","feito":false}],"stage":"Entrevista Marcos","telefone":"(11) 9.6923-8471"},"cmw3vfie4":{"nome":"Tiago Perrelli","stage":"Entrevista Marcos","reunioes":[{"com":"Bruna","tipo":"Entrevista Bruna","data":"2026-11-05","hora":"10:00","feito":tru  da 5.4 para a 7.x."}}}</script>
